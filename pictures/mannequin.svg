<!--?xml version="1.0" encoding="utf-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" role="img" aria-label="fashion mannequin outline">
  <g fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Neck -->
    <line x1="100" y1="40" x2="100" y2="60"></line>

    <!-- Shoulders and torso outline -->
    <path d="M60 60
             C58 90, 65 140, 100 150
             C135 140, 142 90, 140 60
             Z"></path>

    <!-- Waist and hips -->
    <path d="M75 150
             C70 190, 70 220, 100 230
             C130 220, 130 190, 125 150
             Z"></path>

    <!-- Stand pole -->
    <line x1="100" y1="230" x2="100" y2="280"></line>

    <!-- Base -->
    <line x1="70" y1="280" x2="130" y2="280"></line>
  </g>
</svg>
